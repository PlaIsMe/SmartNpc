plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); forge() }
configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}
dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    modImplementation "dev.architectury:architectury-forge:${rootProject.architectury_version}"
    // Forge resolves the nested API without a separate player download.
    include "dev.architectury:architectury-forge:${rootProject.architectury_version}"
    modCompileOnly 'maven.modrinth:yes-steve-model:Zqooxsd2'
    modCompileOnly 'curse.maven:epic-fight-mod-405076:8049910'
    modCompileOnly 'curse.maven:combat-evolution-1377795:8699861'
    modCompileOnly 'curse.maven:cloth-config-348521:5729105'
    modCompileOnly 'curse.maven:playeranimator-658587:4587214'
    modCompileOnly 'curse.maven:better-combat-by-daedelus-639842:7287334'
    include 'io.github.llamalad7:mixinextras-forge:0.5.0'
    implementation 'io.github.llamalad7:mixinextras-common:0.5.0'
    implementation 'io.github.llamalad7:mixinextras-forge:0.5.0'
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive = false }
}
shadowJar { configurations = [project.configurations.shadowCommon]; archiveClassifier = 'dev-shadow' }
remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
    archiveClassifier = ''
    destinationDirectory = rootProject.file(rootProject.delivery_directory)
}
jar { archiveClassifier = 'dev' }
sourcesJar {
    dependsOn ':common:sourcesJar'
    from project(':common').sourceSets.main.allSource
}
def npcDataModId = rootProject.mod_id
def npcGeneratedResources = project(':common').file('src/generated/resources').absolutePath
def npcExistingResources = project(':common').file('src/main/resources').absolutePath
loom {
    runs {
        data {
            data()
            runDir 'run-data'
            programArgs '--mod', npcDataModId, '--all', '--output', npcGeneratedResources, '--existing', npcExistingResources
        }
    }
    forge {
        mixinConfig 'smart_npc.mixins.json'
        mixinConfig 'smart_npc.forge.mixins.json'
        convertAccessWideners = true
        extraAccessWideners.add 'smart_npc.accesswidener'
    }
}

if (providers.gradleProperty('compatRuntime').map { it.toBoolean() }.getOrElse(false)) {
    dependencies {
        modLocalRuntime 'maven.modrinth:yes-steve-model:Zqooxsd2'
        modLocalRuntime 'curse.maven:better-combat-by-daedelus-639842:7287334'
        modLocalRuntime 'curse.maven:playeranimator-658587:4587214'
        modLocalRuntime 'curse.maven:cloth-config-348521:5729105'
    }
}
