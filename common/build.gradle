architectury { common('fabric', 'neoforge') }
loom { accessWidenerPath = file('src/main/resources/smart_npc.accesswidener') }
dependencies {
    compileOnly 'com.electronwill.night-config:core:3.8.0'
    compileOnly 'com.electronwill.night-config:toml:3.8.0'
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${rootProject.architectury_version}"
    // Retain the existing TOML format and config migration on both loaders.
    modCompileOnly 'maven.modrinth:forge-config-api-port:N5qzq0XV'
    modCompileOnly 'dev.kosmx.player-anim:player-animation-lib-fabric:2.0.0-alpha1+1.21'
}
sourceSets.main.resources.srcDir 'src/generated/resources'
