architectury { common('fabric', 'forge') }
loom { accessWidenerPath = file('src/main/resources/smart_npc.accesswidener') }
dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${rootProject.architectury_version}"
    // Retain the existing TOML format and config migration on both loaders.
    modCompileOnly 'maven.modrinth:forge-config-api-port:HvR3IdRE'
    modCompileOnly 'dev.kosmx.player-anim:player-animation-lib-fabric:1.0.2+1.19.4'
}
sourceSets.main.resources.srcDir 'src/generated/resources'
