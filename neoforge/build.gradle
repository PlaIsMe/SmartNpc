plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); neoForge() }
configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}
dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    // Forge resolves the nested API without a separate player download.
    include "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    modCompileOnly 'maven.modrinth:yes-steve-model:HZWaR0LY'
    modCompileOnly 'curse.maven:epic-fight-mod-405076:8175609'
    modCompileOnly 'curse.maven:cloth-config-348521:5729127'
    modCompileOnly 'curse.maven:playeranimator-658587:7389814'
    modCompileOnly 'curse.maven:better-combat-by-daedelus-639842:8430183'
    include 'io.github.llamalad7:mixinextras-neoforge:0.5.0'
    implementation 'io.github.llamalad7:mixinextras-common:0.5.0'
    implementation 'io.github.llamalad7:mixinextras-neoforge:0.5.0'
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}
shadowJar { configurations = [project.configurations.shadowCommon]; archiveClassifier = 'dev-shadow' }
remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
    archiveClassifier = ''
    destinationDirectory = rootProject.file(rootProject.delivery_directory)
}
processResources { from('src/main/templates') }
jar { archiveClassifier = 'dev' }
sourcesJar {
    dependsOn ':common:sourcesJar'
    from project(':common').sourceSets.main.allSource
}
def npcDataModId = rootProject.mod_id
def npcGeneratedResources = project(':common').file('src/generated/resources').absolutePath
def npcExistingResources = project(':common').file('src/main/resources').absolutePath
loom {
    runs {
        data {
            data()
            runDir 'run-data'
            programArgs '--mod', npcDataModId, '--all', '--output', npcGeneratedResources, '--existing', npcExistingResources
        }
    }
    neoForge { accessTransformer(file('src/main/resources/META-INF/accesstransformer.cfg')) }
}

if (providers.gradleProperty('compatRuntime').map { it.toBoolean() }.getOrElse(false)) {
    dependencies {
        modLocalRuntime 'maven.modrinth:tiny-config:3.1.0-neoforge'
        modLocalRuntime 'maven.modrinth:yes-steve-model:HZWaR0LY'
        modLocalRuntime 'curse.maven:epic-fight-mod-405076:8175609'
        modLocalRuntime 'curse.maven:better-combat-by-daedelus-639842:8430183'
        modLocalRuntime 'curse.maven:playeranimator-658587:7389814'
        modLocalRuntime 'curse.maven:cloth-config-348521:5729127'
    }
}
