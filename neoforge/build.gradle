plugins { id 'com.gradleup.shadow' }
architectury { platformSetupLoomIde(); neoForge() }
configurations {
    common { canBeResolved = true; canBeConsumed = false }
    shadowBundle { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}
dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    implementation(include("dev.architectury:architectury-neoforge:${rootProject.architectury_version}"))
    compileOnly 'maven.modrinth:player-animation-library:lQIjpkZc'
    implementation(include('io.github.llamalad7:mixinextras-neoforge:0.5.0'))
    common(project(path: ':common')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}
jar { archiveClassifier = 'raw' }
// No-remap Loom applies nested libraries to jar, so shadow its processed output.
shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
    destinationDirectory = rootProject.file(rootProject.delivery_directory)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
assemble.dependsOn shadowJar
sourcesJar { from project(':common').sourceSets.main.allSource }
loom.runs.server.programArgs '--nogui'
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "SmartNPC-${project.name}-${rootProject.minecraft_version}"
            artifact tasks.named('shadowJar')
            artifact tasks.named('sourcesJar')
        }
    }
    repositories { maven { url = rootProject.layout.buildDirectory.dir('repo') } }
}

processResources { from 'src/main/templates' }
loom { neoForge { accessTransformer(file('src/main/resources/META-INF/accesstransformer.cfg')) }; runs { data { clientData(); runDir 'run-data'; programArgs '--mod', rootProject.mod_id, '--all', '--output', project(':common').file('src/generated/resources').absolutePath, '--existing', project(':common').file('src/main/resources').absolutePath } } }

if (providers.gradleProperty('compatRuntime').map { it.toBoolean() }.getOrElse(false)) {
    dependencies {
        runtimeOnly 'maven.modrinth:better-combat:RbEnSa47'
        runtimeOnly 'maven.modrinth:player-animation-library:lQIjpkZc'
        runtimeOnly 'maven.modrinth:cloth-config:GchRXPnb'
        runtimeOnly 'maven.modrinth:tiny-config:4.0.1-neoforge'
        ['parser', 'lexer', 'runtime'].each { module -> runtimeOnly("org.redlance.mochafloats:${module}:6.2.0") { transitive = false } }
        runtimeOnly 'org.redlance.common-utils:services:1.4.2'
    }
}

// The retained 26.1 YSM adapters cannot link against RenderPearl. Keep save/config
// fields, but omit the native implementation until a 26.3 YSM API is supported.
sourceSets.main.java {
    exclude '**/NeoForgeYsm265ServerAdapter.java'
    exclude '**/Ysm265Renderer.java'
}
