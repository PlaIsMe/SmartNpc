plugins {
    id 'base'
    id 'maven-publish'
    id 'architectury-plugin' version '3.5.170'
    id 'dev.architectury.loom-no-remap' version '1.17.493' apply false
    id 'com.gradleup.shadow' version '9.4.2' apply false
}
architectury { minecraft = minecraft_version }
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'dev.architectury.loom-no-remap'
    group = rootProject.mod_group_id
    version = rootProject.mod_version
    base { archivesName = "SmartNPC-${project.name}-${rootProject.minecraft_version}" }
    java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://repo.redlance.org/public'; content { includeGroupByRegex 'com.zigythebird.*'; includeGroup 'org.redlance.common-utils' } }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.0'))
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25; options.compilerArgs.addAll(['-Xmaxerrs', '200']) }
    tasks.withType(JavaExec).configureEach { javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) } }
    tasks.withType(ProcessResources).configureEach {
        def properties = rootProject.properties.findAll { key, value -> key.startsWith('mod_') || key.endsWith('_version') || key.endsWith('_version_range') }
        inputs.properties(properties)
        filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) { expand(properties) }
    }
    tasks.named('jar', Jar) {
        manifest.attributes('Specification-Title': rootProject.mod_id, 'Specification-Vendor': rootProject.mod_authors, 'Specification-Version': '1', 'Implementation-Title': "SmartNPC-${project.name}", 'Implementation-Version': rootProject.mod_version, 'Implementation-Vendor': rootProject.mod_authors)
    }
}
tasks.named('assemble') { dependsOn ':fabric:assemble', ':neoforge:assemble' }
tasks.register('compileJava') { dependsOn ':common:compileJava', ':fabric:compileJava', ':neoforge:compileJava' }
tasks.named('build') { dependsOn ':fabric:build', ':neoforge:build' }
tasks.named('publish') { dependsOn ':fabric:publish', ':neoforge:publish' }
