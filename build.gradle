plugins {
    id 'base'
    id 'maven-publish'
    id 'architectury-plugin' version '3.4.164'
    id 'dev.architectury.loom' version '1.11.458' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury { minecraft = minecraft_version }

subprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'dev.architectury.loom'
    group = rootProject.mod_group_id
    version = rootProject.mod_version
    base { archivesName = "SmartNPC-${project.name}-${rootProject.minecraft_version}" }
    java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
    loom { silentMojangMappingsLicense(); mixin { useLegacyMixinAp = true; defaultRefmapName = "smart_npc.${project.name}.refmap.json" } }
    repositories {
        exclusiveContent {
            forRepository { maven { url = 'https://maven.fabricmc.net/' } }
            filter { includeGroupByRegex 'net.fabricmc.*' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.architectury.dev/' } }
            filter { includeGroupByRegex 'dev.architectury.*' }
        }
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.kosmx.dev/' }
        maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
        maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.0'))
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    tasks.withType(ProcessResources).configureEach {
        def properties = rootProject.properties.findAll { key, value -> key.startsWith('mod_') || key.endsWith('_version') || key.endsWith('_version_range') }
        inputs.properties(properties)
        filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json', 'pack.mcmeta']) { expand(properties) }
    }
    tasks.named('jar', Jar) {
        manifest.attributes('Specification-Title': rootProject.mod_id, 'Specification-Vendor': rootProject.mod_authors, 'Specification-Version': '1', 'Implementation-Title': "SmartNPC-${project.name}", 'Implementation-Version': rootProject.mod_version, 'Implementation-Vendor': rootProject.mod_authors)
    }
    if (project.name in ['fabric', 'neoforge']) {
        // Development uses named mixins; each production remap injects the common refmap.
        def commonRefmaps = project(':common').tasks.named('remapJar').flatMap { it.mixinRefmapServiceOptions }
        tasks.named('remapJar') { mixinRefmapServiceOptions.addAll(commonRefmaps) }
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    artifactId = "SmartNPC-${project.name}-${rootProject.minecraft_version}"
                    artifact tasks.named('remapJar')
                    artifact tasks.named('remapSourcesJar')
                }
            }
            repositories { maven { url = rootProject.layout.projectDirectory.dir('mcmodsrepo') } }
        }
    }
}

tasks.named('assemble') { dependsOn ':neoforge:assemble', ':fabric:assemble' }
tasks.register('compileJava') { dependsOn ':common:compileJava', ':neoforge:compileJava', ':fabric:compileJava' }
tasks.named('build') { dependsOn ':neoforge:build', ':fabric:build' }
tasks.named('publish') { dependsOn ':neoforge:publish', ':fabric:publish' }
