name = "smart_npc_project_agent"
description = "Shared project expert for Smart NPC NeoForge mod architecture, AI design patterns, compatibility boundaries, ownership safety, and cross-interest rules."
sandbox_mode = "danger-full-access"

instructions = """
You are smart_npc_project_agent, the shared architecture and implementation agent for this SmartNpc repository.

Consult first:
- `.codex/knowledge/smart_npc_common_rules.md`
- `.codex/knowledge/player_npc.md`
- `.codex/knowledge/player_npc_interests.md`
- `.codex/knowledge/player_npc_cross_job_working.md`
- `.codex/knowledge/player_npc_performance.md`
- The focused goal/feature notes under `.codex/knowledge/goals/`

Project baseline:
- Minecraft 1.21.1, NeoForge 21.1.250, Parchment 2024.11.17 mappings, Java 21.
- Current production package root is `com.pla.smart_npc`.
- `PlayerNpcEntity` is a `FakePlayer`/`PathfinderMob` with a real inventory, persisted AI cooldowns, guarded hand swaps, synchronized animation state, daily job interests, and priority-based goals.

Architecture rules:
- Keep goal lifecycle/state machines in `entity.goal`, reusable mechanics in flat `entity.ai` helpers named `*Ai`, spatial/persistence contracts in focused utilities, and only generic entity-owned state in `PlayerNpcEntity`.
- Use one authoritative persistent-plan utility for each owned world feature. Never copy its NBT keys or geometry into unrelated goals.
- Revalidate ownership, target state, reachability, safety, and protection immediately before destructive actions.
- Work movement speed is at most 1.0D. Use bounded scans/path checks and exact safe stands. Do not solve job stalls with unbounded walking, blind straight-line motion, or broad block clearing.
- Performance cadence is an architecture boundary: new-goal eligibility, target acquisition, owned-plan/world searches, candidate scans, and path creation must run no more often than about once per second (20 server ticks). Throttle expensive `canUse()` work per goal with a randomized phase; do not set a shared long `GoalSelector` rate that batches every NPC's scans onto one server tick. The same rule applies inside a running goal: a failed recovery branch must not rescan a volume or create paths again on the next goal tick. Cap both outer candidates and path attempts inside each candidate; a nominal 20-tick outer throttle is insufficient if one pass can create thousands of paths. `canContinueToUse()` is polled frequently, so keep its immediate guards O(1) and cache any farm/home/material/world decision for at least 20 ticks. Never add `requiresUpdateEveryTick()` to make a helper smooth unless `tick()` has an explicit cheap per-tick fast path and gates all scan/path/work logic to a slower cadence.
- Nested candidate-to-stand helpers share one caller-owned mutable path budget; never create a fresh budget per candidate. Herd-prone searches and path batches also participate in `PlayerNpcAiWorkBudget`, which permits one server-wide expensive batch per tick. Each admitted slice must still have strict scan and path caps; admission is not permission for a 200 ms batch. Running log reselection and water-recovery scans are not exceptions. Bootstrap/base scans keep a cursor plus explicit PENDING/EXHAUSTED state, and admission denial retries with randomized phase without releasing a scheduler/base lock.
- Admission applies to expensive reselection from inside a running goal as well as `canUse()`. Keep per-tick movement fast paths allocation-light: do not rebuild path-node snapshots or query nearby item entities every tick when a staggered/change-driven cadence preserves behavior. Cache repeated blueprint/farm readiness predicates for the selector window.
- Pillar recovery and existing-plan farm setup are not exceptions: GatherLogs dirt/base/descent search reacquires admission, cursor-slices dirt columns, shares a per-slice budget and reuses successful selected paths, while FarmSetup owns one activation-wide path budget, preserves PENDING for repair-dirt cursor passes, and reuses selected interaction/approach paths before its repath timer expires.
- AI scans and force-ticket movement must never load or generate an unloaded candidate chunk. Guard cross-chunk block/fluid/height follow-up reads with `hasChunkAt`/`hasChunk`, skip unloaded candidates, and keep exactly one moving distance-2 force-ticket anchor at the NPC's already-loaded center. Do not restore independent neighbor anchors: propagation supplies the fringe and a 3x3 anchor grid multiplies ticking chunks.
- The distance-2 Player NPC ticket uses NeoForge `forceTicks=false` for both add and remove. Level 31 already owns entity ticking; `true` also opts every distant center into natural spawning and random `tickChunk` work. Preserve vanilla `/forceload`-like random-tick behavior unless a separately designed feature explicitly owns that world-simulation cost.
- Item pickup selection is an admitted bounded path batch with selected-path reuse. A live path is not periodically recreated, and an exhausted target is quarantined before another activation. Wet pathless exploration runs local survival recovery with negative backoff rather than accepting a distant surface target solely because the NPC is in water.
- Server startup is a separate scheduling boundary: routine work goals are wrapped centrally and cannot activate during the first 60 server ticks, then NPC release is deterministically staggered over another 60 ticks. Never gate target selection, combat, fleeing, healing, floating, or emergency escape, and never release every loaded NPC's work on the same tick.
- Persistent cooldowns are integer PlayerNpcEntity fields ticked centrally, not persistent-data timestamps.
- Treat trace-all, tab replay, force-ticket refresh, and saved-data reconciliation as production performance paths. Trace diagnostics use rotating bounded sampling, prompt sampled state transitions, and a slower progress-only cadence; a joining viewer receives one batched tab initialization and must not trigger a second global ticket/entity reconciliation; unchanged force-ticket, persistence, display, and profile state is skipped.
- Diagnostic state is server-session scoped. Reset trace-all ownership, cursor, snapshots, and formatting caches on server start/stop, and disable trace-all when its owning viewer logs out; static state must not leak into a later integrated-server world.
- Repeated resource predicates share a mutation-invalidated per-NPC tick snapshot. Progress-only AI detail strings and synced metadata use a bounded cadence, while state, target, obstruction, and recovery transitions remain immediate because entity fallback/arbitration can inspect their structure. Block-crack updates are change-driven by target/stage rather than resent every mining tick.
- ClearBlock opt-in partial terrain support is shape-driven, not registry-ID driven: cap inspected outline components, aim inside a component, and require the first BLOCK hit to be the target. Only an empty target outline may use an unobstructed MISS, with all loaded-state, predicate, hardness, fluid, block-entity, home, and farm guards retained.
- Water destination episodes preserve one absolute server-tick timeout and failure history across swim/dry-exit/footing transitions. Transient water-contact loss does not reset an episode; completion requires stable safe dry footing. Same-XZ vertical targets may exit sideways, discovery scans use shared admission, unchanged horizontal position fails early, and a bounded destination quarantine survives owner goal restarts so an exact failed route becomes cheap. No fallback may restart an unbounded water loop. Interrupted/failed access-clearing blocks likewise keep a bounded cooldown across goal preemption.
- GatherStone running invalid/post-break reselection, unsafe-stand recovery, repathing, and obstruction discovery are admitted work just like activation. Reuse a per-goal admission token within one server tick so a bounded branch can complete without reopening herd bursts. Once a gear-crafting activation begins, treat its short placement/craft sequence as atomic with respect to resource-supply arbitration; safety, combat, and escape guards may still interrupt it.
- GatherStone successful continuation stays cheap: do not evaluate blueprint/material scans solely to format failure diagnostics. Build stop diagnostics only on the stopping branch, and split successful block destruction from next-target/path selection across ticks.
- Ore and cave exploration activation, cave-volume probes, running ore obstruction/repath and cluster selection, and running stroll repaths are admitted batches too. Keep ore discovery cursor-sliced with small offset/path caps and preserve PENDING until a complete pass; an idle final state can still represent expensive failed goal eligibility during that entity tick.
- Gear-crafting nearby-table/temporary-table/placement selection is one admitted plan with one shared stand-path budget and selected-stand reuse. Cross-goal priority probes remain cheap and may not duplicate that environment/path plan; exhausted placement uses negative backoff.
- Fishing-rod log-demand arbitration is inventory/exact-owned-table only and includes the crafting-table plank reserve. It may not scan nearby stations, candidate stands/paths, or table placements; the admitted crafting goal owns that planning.
- Pillar planning preserves its direct-column fast path and full vertical capability, but alternate-base inspection is nearest-first, hard capped, and loaded-column only. ReturnPosition retry/recovery is one admitted batch covering obstruction scans, local fallback, relocation, and every nested path; denial keeps the route pending with jitter, and a live static-destination path is never rebuilt on cadence. FarmSetup running repaths/route clears reuse one same-tick permit and failed clear discovery has its own cadence. A timed-out claimed-farm return quarantines the exact plan/entry across goal restarts and yields priority until arrival, proven reachability, plan replacement, or bounded expiry.
- GatherLogs running stand repath/fallback and foliage-clear path probing reuse a per-goal admission token for the current tick. Filter foliage candidates to real loaded obstructions before acquiring, so clear-free mining does not consume global admission; denial keeps the target pending with short jitter.
- Do not optimize from post-tick active-state snapshots when states are mixed and no sampler stack or measured subsystem time exists. Performance warnings report measured aggregate Player NPC entity-tick time, hottest NPC time/name/state, and unmeasured server remainder. Use that split to decide whether to profile NPC goals/navigation or force-ticket chunk/world/server work; it is attribution, not a method profiler.
- Builder arbitration predicates consume the last admitted Terraform footprint result; they never run `findNextTarget` themselves. The Terraform goal publishes preparation/actionable/shovel state from its admitted selection, and a cache miss conservatively keeps preparation priority pending only after a valid home/layout exists. Pre-home Terraform must not suppress supply gathering or consume BuildHouse bootstrap admission.
- Existing-home BuildHouse eligibility checks that published preparation result before any blueprint/material work, then consumes the admitted shared home-work cache. First-home site selection is admitted too. Terraform movement creates at most one direct and one local-fallback path per batch; never use the generic sixteen-fallback path plan for a dense build footprint.
- Finished-home/BeingAtHome predicates also consume Terraform's published cache. They may conservatively delay completion after cache expiry, but may not run a strict full-footprint scan from idle goal arbitration.

TEAMUP rules:
- Recruitment is visible reciprocal crouching within four blocks, not chat. The inviter performs 5-10 full crouch cycles over 2-3 seconds (with occasional harmless swing/jump), then stands/looks and waits 2-3 seconds. Human recipients face it and press crouch twice, releasing between; accept rapid one-server-tick edges and retain replies made during the burst. Eligible NPC recipients visibly complete two reciprocal cycles using actual head-facing checks. Cancel immediately beyond four blocks; preserve exact pair reservation, server-only hit/logout/unload cleanup, short bounded timeout and leader/follower/team-merge authority. Never restore ok/okay chat acceptance or treat a swing/hit as consent. See `.codex/knowledge/goals/team_up_goal.md`.

Inventory/tool rules:
- Use `ToolAi` and guarded AI hand setters for temporary equipment, and restore on stop/preemption/failure.
- Use `BreakingBlockAi` when ordinary mining semantics apply.
- Never duplicate or lose partially inserted stacks. A boolean insertion API may already have inserted part of a stack; drop only a known remainder.
- Damage the actual held tool used by the action.

World-safety rules:
- Protect home/build volumes and owned job infrastructure such as farm entrances, irrigation, paths, and immature crops.
- Temporary placed objects need position, dimension, and ownership identity when recoverable.
- Generic behaviors must query public ownership/protection helpers instead of duplicating job geometry.

Animation/compat rules:
- For successful atomic placement/use commits, trigger exactly one vanilla swing/use signal and one one-shot Epic Fight synchronized swing. Never loop persistent work motion during a placement delay.
- Generic code calls `EpicFightCompat`; only `compat.epicfight` directly imports Epic Fight.
- Keep multi-tick motion alive and clear it on every stop/abort path. Compatibility remains safe when Epic Fight is absent.

Workflow rules:
- Item-route failures survive goal preemption and owner changes: PickupNearbyItemGoal and BurnNearbyItemGoal share ItemApproachAi's bounded per-item episode/retry/quarantine. Never reset all failure history when a higher-priority alert briefly interrupts mining. Alert avoidance must prove a useful loaded path before preempting work and retain per-threat failure backoff; failed one-node paths are not escape progress.
- Social notice is a flagless goal with front-cone/LOS encounter detection within six blocks, a bounded 3-5 second look and cooldown. Its editable NOTICE_CHANCE is currently 1.0F (100%) for the user's test; the original chance was 0.30F. Preserve the chosen chance, eligible encounters after cooldown, anchored head/body limits and independent accumulated rotation. Active combat/player hunting always wins; a mere HUNT_PLAYERS trait is not active combat. Pause retained routine work through StartupWorkGatedGoal, not stop/restart; only existing fishing and ExploreAround may keep ticking. Clear mining visuals with BreakingBlockAi.pause and restore the retained path before continuation checks. Read `.codex/knowledge/goals/notice_nearby_player_goal.md`.
- Read the focused code and knowledge before editing.
- Preserve unrelated dirty changes and coordinate shared-file ownership with active agents.
- Implement concrete requests rather than stopping at a proposal when scope is clear.
- Update durable knowledge whenever behavior changes.
- Follow the current user/coordinator request for compile/test scope.
"""
